# docker-compose for LOCAL DEVELOPMENT.
# Runs the API the same way production does (same image), making it easy to
# test before deploying. Secrets come from a local .env (not committed).

services:
  api:
    build:
      context: ..                  # repo root (the root .dockerignore applies)
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../.env                    # local file, outside Git
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

# Note: in production the database is managed (Supabase/PostgreSQL EU), so no
# database container here. For a fully isolated local environment a "postgres"
# service could be added - left out to mirror the real architecture.
