# API Deployment: tells Kubernetes HOW to run the application and how many
# copies to keep. If a pod dies, the Deployment recreates it (self-healing).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horaamiga-api
  namespace: horaamiga
spec:
  replicas: 2                      # 2 copies: tolerates losing one without going offline
  selector:
    matchLabels:
      app: horaamiga-api
  template:
    metadata:
      labels:
        app: horaamiga-api
    spec:
      containers:
        - name: api
          # Pinned version tag - never :latest in production (no rollback target,
          # and "latest" can silently change under you). CI bumps this tag.
          image: ghcr.io/diego-cruz-github/horaamiga-api:v1.0.0
          ports:
            - containerPort: 3000

          # Requests/limits: requests = what the pod reserves; limits = the cap.
          # Without them, one pod can starve the others on the same node.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # Probes: Kubernetes needs two different answers.
          # readiness = "can I receive traffic yet?" (only joins the Service when ready)
          # liveness  = "am I still alive?" (if stuck, Kubernetes restarts the pod)
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20

          # Secrets come from a cluster Secret (a reference here, never the value).
          envFrom:
            - secretRef:
                name: horaamiga-secrets   # created outside Git (see secret.example.yaml)
