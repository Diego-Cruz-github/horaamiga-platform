# Ingress: the HTTP(S) front door of the cluster.
# Routes app.horaamiga.pt/api to the API Service. TLS via cert-manager (Let's Encrypt).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: horaamiga-ingress
  namespace: horaamiga
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod   # issues/renews the certificate automatically
spec:
  ingressClassName: traefik    # k3s ships with Traefik as the ingress controller
  tls:
    - hosts:
        - app.horaamiga.pt
      secretName: horaamiga-tls
  rules:
    - host: app.horaamiga.pt
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: horaamiga-api
                port:
                  number: 80
