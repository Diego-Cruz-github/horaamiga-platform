# MODELO de Secret. O Secret REAL e criado direto no cluster (nunca versionado):
#   kubectl create secret generic horaamiga-secrets -n horaamiga --from-env-file=.env
# Este arquivo so documenta quais chaves o Deployment espera.
apiVersion: v1
kind: Secret
metadata:
  name: horaamiga-secrets
  namespace: horaamiga
type: Opaque
stringData:
  SUPABASE_URL: "<preencher-fora-do-git>"
  SUPABASE_SERVICE_ROLE_KEY: "<preencher-fora-do-git>"
  DATABASE_URL: "<preencher-fora-do-git>"
  JWT_SECRET: "<preencher-fora-do-git>"
  TELEGRAM_BOT_TOKEN: "<preencher-fora-do-git>"
