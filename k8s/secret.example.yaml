# Secret TEMPLATE. The REAL Secret is created directly in the cluster (never committed):
#   kubectl create secret generic horaamiga-secrets -n horaamiga --from-env-file=.env
# This file only documents which keys the Deployment expects.
apiVersion: v1
kind: Secret
metadata:
  name: horaamiga-secrets
  namespace: horaamiga
type: Opaque
stringData:
  SUPABASE_URL: "<fill-outside-git>"
  SUPABASE_SERVICE_ROLE_KEY: "<fill-outside-git>"
  DATABASE_URL: "<fill-outside-git>"
  JWT_SECRET: "<fill-outside-git>"
  TELEGRAM_BOT_TOKEN: "<fill-outside-git>"
