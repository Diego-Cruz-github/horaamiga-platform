# Service: gives the API pods a stable address.
# Pods die and respawn with different IPs; the Service is the fixed "front desk"
# that knows where the live pods are and load-balances across them.
apiVersion: v1
kind: Service
metadata:
  name: horaamiga-api
  namespace: horaamiga
spec:
  type: ClusterIP            # reachable only inside the cluster; the Ingress exposes it
  selector:
    app: horaamiga-api       # routes traffic to pods with this label
  ports:
    - port: 80
      targetPort: 3000       # container port
