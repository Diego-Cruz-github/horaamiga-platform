# HPA (Horizontal Pod Autoscaler): adds/removes pods automatically with load.
# Requires metrics-server in the cluster to read CPU usage.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: horaamiga-api
  namespace: horaamiga
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: horaamiga-api
  minReplicas: 2            # never below 2 (high availability)
  maxReplicas: 5            # cap so the node is not overwhelmed
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # above 70% average CPU -> scale up
