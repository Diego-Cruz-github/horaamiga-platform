# Role common: server baseline and hardening.
# The security foundation that comes before any application.

- name: Update package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ufw          # host firewall (defense in depth, alongside the Hetzner edge firewall)
      - fail2ban     # bans IPs that brute-force SSH
      - curl
      - git
      - unattended-upgrades  # automatic security patches
    state: present

# Non-root user for operations (never work as root directly).
- name: Create deploy user
  ansible.builtin.user:
    name: deploy
    groups: sudo
    shell: /bin/bash
    create_home: true

- name: Authorize the admin SSH key for the deploy user
  ansible.posix.authorized_key:
    user: deploy
    key: "{{ lookup('file', ssh_public_key) }}"
  vars:
    ssh_public_key: "~/.ssh/id_ed25519.pub"

# SSH hardening: no passwords (key-only) and no direct root login.
- name: Harden SSH configuration
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
    mode: "0644"
  notify: Restart SSH

# UFW: default-deny inbound, open only what is needed.
- name: UFW - deny incoming by default
  community.general.ufw:
    direction: incoming
    policy: deny

- name: UFW - allow SSH, HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"

- name: UFW - enable
  community.general.ufw:
    state: enabled

- name: Ensure fail2ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
