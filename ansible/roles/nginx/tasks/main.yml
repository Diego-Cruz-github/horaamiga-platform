# Role nginx: reverse proxy na frente da aplicacao.
# Serve os estaticos (site/PWA) e encaminha /api pro Node (PM2).

- name: Instalar Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Publicar configuracao dos sites
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/horaamiga.conf
    mode: "0644"
  notify: Recarregar Nginx

- name: Habilitar o site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/horaamiga.conf
    dest: /etc/nginx/sites-enabled/horaamiga.conf
    state: link
  notify: Recarregar Nginx

- name: Remover site default do Nginx
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Recarregar Nginx

- name: Garantir Nginx ativo
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
