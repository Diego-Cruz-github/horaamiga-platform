# Role nginx: reverse proxy in front of the application.
# Serves the static assets (site/PWA) and forwards /api to Node (PM2).

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Publish site configuration
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/horaamiga.conf
    mode: "0644"
  notify: Reload Nginx

- name: Enable the site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/horaamiga.conf
    dest: /etc/nginx/sites-enabled/horaamiga.conf
    state: link
  notify: Reload Nginx

- name: Remove the default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Ensure Nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
