# Role node: application runtime (Node.js LTS + PM2).

- name: Add NodeSource repository (Node 20 LTS)
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list  # idempotency: only runs if not present yet

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

# PM2: process manager. Keeps the API alive (automatic restart on crash) and
# runs in cluster mode (multiple instances using the CPU cores).
- name: Install PM2 globally
  community.general.npm:
    name: pm2
    global: true

- name: Configure PM2 to start on server boot
  ansible.builtin.shell: pm2 startup systemd -u deploy --hp /home/deploy
  args:
    creates: /etc/systemd/system/pm2-deploy.service
