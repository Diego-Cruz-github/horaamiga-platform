# HoraAmiga server configuration playbook.
# Runs AFTER Terraform creates the VM. Idempotent: run it as many times as you
# want and it converges to the same state (only changes what differs).
#
# Setup:  ansible-galaxy collection install -r requirements.yml
# Run:    ansible-playbook playbook.yml
# Dry-run (check without applying): ansible-playbook playbook.yml --check
#
# Organized in roles (each role owns one slice of the configuration):
#   common  -> base hardening (user, UFW, fail2ban)
#   node    -> Node.js + PM2
#   nginx   -> reverse proxy + sites
#   certbot -> automated Let's Encrypt SSL

- name: Configure HoraAmiga production server
  hosts: web
  become: true

  roles:
    - common
    - node
    - nginx
    - certbot
