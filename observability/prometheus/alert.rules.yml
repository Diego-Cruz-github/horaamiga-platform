# Regras de alerta. Quando a condicao fica verdadeira por X tempo, dispara.
# Para um servico de cuidado a idosos, "a API caiu" e alerta critico.

groups:
  - name: horaamiga
    rules:
      # API fora do ar.
      - alert: ApiDown
        expr: up{job="horaamiga-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API do HoraAmiga fora do ar"
          description: "O scrape da API falhou por mais de 1 minuto."

      # Latencia alta (p95 acima de 1s) - metrica RED: Duration.
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latencia p95 acima de 1s"
          description: "A API esta lenta nos ultimos 5 minutos."

      # Taxa de erro 5xx alta - metrica RED: Errors.
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de erro 5xx elevada"
          description: "Mais de 5% das requisicoes retornando erro de servidor."
