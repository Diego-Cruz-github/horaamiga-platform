# Alert rules. When the condition holds for X time, the alert fires.
# For an elderly-care service, "the API is down" is a critical alert.

groups:
  - name: horaamiga
    rules:
      # API down.
      - alert: ApiDown
        expr: up{job="horaamiga-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HoraAmiga API is down"
          description: "Scraping the API has failed for more than 1 minute."

      # High latency (p95 above 1s) - RED metric: Duration.
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 1s"
          description: "The API has been slow for the last 5 minutes."

      # High 5xx error rate - RED metric: Errors.
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated 5xx error rate"
          description: "More than 5% of requests are returning server errors."
