# Prometheus configuration: defines WHAT to collect and HOW OFTEN.
# Prometheus works by "scraping" - it pulls metrics from each target periodically.

global:
  scrape_interval: 15s          # collect every 15s (good default: granular without heavy load)
  evaluation_interval: 15s

# Where to send alerts (Alertmanager -> Telegram, reusing the existing bot).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Alert rules (e.g. API down, high latency) live in this file.
rule_files:
  - "alert.rules.yml"

scrape_configs:
  # Prometheus itself (its own health).
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # The HoraAmiga API exposes /metrics (via prom-client in Node).
  - job_name: "horaamiga-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["horaamiga-api:3000"]

  # Host metrics (CPU/RAM/disk) via node_exporter.
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
