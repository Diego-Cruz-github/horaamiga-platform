# Loki: agregador de logs (alternativa leve ao ELK). Integra nativo com o Grafana.
# Escolhido por caber em servidor pequeno - Elasticsearch comeria RAM demais.
# Config minima de single-binary (suficiente pro porte do projeto).

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Retencao curta pra nao encher o disco do servidor pequeno.
limits_config:
  retention_period: 168h    # 7 dias
