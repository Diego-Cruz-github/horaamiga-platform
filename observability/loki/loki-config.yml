# Loki: log aggregator (lightweight alternative to ELK). Native Grafana integration.
# Chosen because it fits a small server - Elasticsearch would eat too much RAM.
# Minimal single-binary config (enough for this project's scale).

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Short retention so the small server's disk does not fill up.
limits_config:
  retention_period: 168h    # 7 days
